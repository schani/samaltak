name: Tests

on:
  push:
    branches: [main, wip/c4-concurrent-gc]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'wip/c4-concurrent-gc' ||
      github.event.pull_request.head.repo.full_name != github.repository
    name: ${{ matrix.targets }}
    # make test's stages (see the Makefile), so that each job fits its timeout and every stage reports
    strategy:
      fail-fast: false
      matrix:
        targets:
          - test-core
          - test-jit-none
          - test-jit-baseline
          - test-jit-opt test-jit-cache
          - test-jit-deopt test-tools
          - test-uefi
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      SDL_VIDEODRIVER: x11
      SDL_VIDEO_X11_SCALING_FACTOR: '2'
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      XDG_RUNTIME_DIR: /tmp/samaltak-runtime
    steps:
      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential nodejs python3 perl less \
            xvfb xauth mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev
      - uses: actions/checkout@v6
      - name: Install SDL3 and shaderc
        run: .agents/setup
      - name: Run ${{ matrix.targets }} with software Vulkan
        run: |
          mkdir -p .context "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a -s '-screen 0 1280x1024x24' make ${{ matrix.targets }}
