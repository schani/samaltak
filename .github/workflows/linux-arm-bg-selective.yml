name: Native Linux ARM64 selective background JIT
on:
  push:
    branches: ['validate/linux-arm-bg-selective-*']

permissions:
  contents: read

concurrency:
  group: native-arm64-selective-bg-jit
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'schani/samaltak' && github.event_name == 'push' && github.event.created == true && github.event.deleted == false && github.run_attempt == '1'
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm-slim
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      A: 'bfba965cab254aaf6d208139e54b3488d9cc0863'
      LC_ALL: C
      DEBIAN_FRONTEND: noninteractive
      SDL_VIDEO_DRIVER: samaltak_no_video
      SDL_VIDEODRIVER: samaltak_no_video
    steps:
      - name: Confirm native ARM64 and install checkout prerequisites
        timeout-minutes: 4
        run: |
          set -euo pipefail
          [[ "$RUNNER_ARCH" == ARM64 && "$(uname -sm)" == 'Linux aarch64' ]]
          [[ "$(dpkg --print-architecture)" == arm64 && "$(id -u)" == 0 ]]
          [[ "$GITHUB_REF" =~ ^refs/heads/validate/linux-arm-bg-selective-[0-9a-f]{40}$ ]]
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 util-linux

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2 # Harness commit and its sole parent, the candidate.
          path: validation
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.A }}
          fetch-depth: 1
          path: base
          persist-credentials: false

      - name: Verify the branch pin and archive exact trees
        timeout-minutes: 3
        run: |
          set -euo pipefail
          B=${GITHUB_REF##*-}
          logs="$RUNNER_TEMP/bg-jit-logs"
          mkdir "$logs" /tmp/bg-jit-ab /tmp/bg-jit-ab/{A,B}
          for tree in base validation; do
            git config --global --add safe.directory "$GITHUB_WORKSPACE/$tree"
          done
          [[ "$(git -C base rev-parse HEAD)" == "$A" ]]
          [[ "$(git -C validation rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git -C validation show -s --format=%P HEAD)" == "$B" ]]
          [[ "$B" != "$A" ]]
          git -C validation diff --name-status --no-renames "$B" HEAD > "$logs/validation-paths.txt"
          diff -u <(printf 'A\t%s\n' .github/scripts/bg-jit-ab.py \
            .github/scripts/bg-jit-selective.md .github/scripts/bg-jit-selective.py \
            .github/workflows/linux-arm-bg-selective.yml) "$logs/validation-paths.txt"
          awfy=vm/tests/bench/awfy
          [[ "$(git -C base rev-parse "$A:$awfy")" == "$(git -C validation rev-parse "$B:$awfy")" ]]
          test "$(git -C validation hash-object .github/scripts/bg-jit-ab.py)" = d46764aeb22adca3f666a6ccbfdb256406267794
          {
            uname -a
            git -C base show -s --format='%H %T %s' "$A"
            git -C validation show -s --format='%H %T %s' "$B" HEAD
            printf 'awfy_tree=%s\n' "$(git -C base rev-parse "$A:$awfy")"
            (cd validation && sha256sum .github/scripts/bg-jit*.py .github/workflows/linux-arm-bg-selective.yml)
          } | tee "$logs/refs.txt"
          for side in A B; do
            tree=base
            [[ "$side" != B ]] || tree=validation
            git -C "$tree" archive "${!side}" -o "/tmp/bg-jit-ab/$side.tar"
            git get-tar-commit-id < "/tmp/bg-jit-ab/$side.tar" | grep -Fx "${!side}"
            sha256sum "/tmp/bg-jit-ab/$side.tar" | tee -a "$logs/archives.sha256"
            tar -xf "/tmp/bg-jit-ab/$side.tar" -C "/tmp/bg-jit-ab/$side"
            rm "/tmp/bg-jit-ab/$side.tar"
          done

      - name: Admit and pin two distinct guest-visible cores
        id: topology
        timeout-minutes: 1
        run: python3 validation/.github/scripts/bg-jit-ab.py topology "$RUNNER_TEMP/bg-jit-logs"

      - name: Install platform VM dependencies (headless equivalent of .agents/setup)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          {
            # Full platform link and file I/O; no display server, UEFI, or Node tools.
            apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build pkg-config perl binutils \
              libshaderc-dev spirv-tools libssl-dev libwayland-dev libvulkan-dev \
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev
            git clone --depth 1 --branch release-3.2.24 https://github.com/libsdl-org/SDL.git /tmp/bg-jit-ab/sdl
            git -C /tmp/bg-jit-ab/sdl rev-parse HEAD
            [[ "$(git -C /tmp/bg-jit-ab/sdl rev-parse HEAD)" == a8589a84226a6202831a3d49ff4edda4acab9acd ]]
            cmake -S /tmp/bg-jit-ab/sdl -B /tmp/bg-jit-ab/sdl/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_UNIX_CONSOLE_BUILD=ON
            cmake --build /tmp/bg-jit-ab/sdl/build --parallel 4
            cmake --install /tmp/bg-jit-ab/sdl/build
            ldconfig
            # Bookworm's shared shaderc has unresolved glslang/SPIRV-Tools symbols.
            mkdir -p /usr/local/lib/pkgconfig
            cat > /usr/local/lib/pkgconfig/shaderc.pc <<'PC'
          Name: shaderc
          Description: shaderc with its static dependencies (bookworm)
          Version: 2023.2.1
          Libs: -lshaderc_combined -Wl,--start-group -lglslang -lSPIRV -lMachineIndependent -lGenericCodeGen -lOSDependent -lOGLCompiler -lglslang-default-resource-limits -lSPIRV-Tools-opt -lSPIRV-Tools -Wl,--end-group -lstdc++ -lpthread -lm
          Cflags:
          PC
            pkg-config --modversion sdl3 openssl shaderc wayland-client
            /usr/bin/gcc --version
            make --version
            python3 --version
          } 2>&1 | tee "$RUNNER_TEMP/bg-jit-logs/toolchain.log"

      - name: Build separate native platform VMs and full images
        id: build
        timeout-minutes: 19
        run: |
          set -euo pipefail
          unset OUT BOOT_IMAGE PACKAGES NO_PLATFORM PGO_GEN MAKEFLAGS MFLAGS GNUMAKEFLAGS MAKEOVERRIDES
          unset CC CFLAGS CPPFLAGS LDFLAGS LDLIBS DISPLAY WAYLAND_DISPLAY XAUTHORITY
          for side in A B; do
            (
              cd "/tmp/bg-jit-ab/$side"
              # Environment CFLAGS lets the Makefile append required platform flags.
              CFLAGS='-O2 -g' timeout --kill-after=15s 8m make -j4 image CC=/usr/bin/gcc NO_PGO=1 BRIEF=1
              test -f vm/build/.variant-platform
              test -s build/samaltak.image
              readelf -h vm/build/samaltak | grep -E 'Machine:[[:space:]]+AArch64$'
              ldd vm/build/samaltak | tee "$RUNNER_TEMP/bg-jit-logs/$side-ldd.txt"
              grep -F libSDL3 "$RUNNER_TEMP/bg-jit-logs/$side-ldd.txt"
              sha256sum vm/build/samaltak build/samaltak.image | tee "$RUNNER_TEMP/bg-jit-logs/$side.sha256"
            ) 2>&1 | tee "$RUNNER_TEMP/bg-jit-logs/build-$side.log"
          done


      - name: Verify deterministic lifecycle against the exact candidate image
        id: lifecycle
        timeout-minutes: 3
        run: |
          set -euo pipefail
          root=/tmp/bg-jit-ab/B
          logs="$RUNNER_TEMP/bg-jit-logs"
          for i in $(seq 1 4); do
            d=$(mktemp -d)
            status=0
            (
              cd "$d"
              env -i PATH=/usr/bin:/bin HOME="$d" TMPDIR="$d" LC_ALL=C \
                SDL_VIDEO_DRIVER=samaltak_no_video SDL_VIDEODRIVER=samaltak_no_video \
                timeout --kill-after=5s 30s taskset -c "$(cat "$logs/cpus.txt")" \
                sh "$root/tests/vm/jit_worker_test.sh" "$root/build/samaltak.image" "$root/vm/build/samaltak"
            ) >"$logs/lifecycle-$i.log" 2>&1 || status=$?
            rm -rf "$d"
            cat "$logs/lifecycle-$i.log"
            printf '%s %s\n' "$i" "$status" | tee -a "$logs/lifecycle-status.txt"
          done
          {
            echo '### Lifecycle (exact candidate VM and freshly built candidate image)'
            echo '```'
            cat "$logs/lifecycle-status.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          awk '$2 != 0 { bad = 1 } END { exit bad || NR != 4 }' "$logs/lifecycle-status.txt"

      - name: Interleaved AWFY A/A, A/B and B/C (ordinary runtime)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.topology.outcome == 'success' }}
        timeout-minutes: 8
        run: python3 validation/.github/scripts/bg-jit-selective.py "$RUNNER_TEMP/bg-jit-logs"

      - name: Verify the VM and image pairs stayed unchanged
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          for side in A B; do
            (cd "/tmp/bg-jit-ab/$side" && sha256sum -c "$RUNNER_TEMP/bg-jit-logs/$side.sha256")
          done | tee "$RUNNER_TEMP/bg-jit-logs/integrity.log"

      - name: Upload evidence
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-arm-bg-selective-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bg-jit-logs/
          if-no-files-found: warn
          retention-days: 7
