name: macOS ARM64 Float x2
on:
  push:
    branches: ['validate/mac-floatx2-*']

permissions:
  contents: read

concurrency:
  group: mac-floatx2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    if: github.event.deleted == false
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      # Historical exact Float x2 pair. For landing, set A to live main
      # and B to the exact reviewed single-commit Float x2 port.
      A: 'f12e0457dfd9e7d3411e11f86f01471d616ea95d'
      B: '50b7a63369eb9f4c50d84470310a042514caa432'
      LC_ALL: C
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3 # validation tip V -> candidate B -> baseline A
          persist-credentials: false

      - name: Verify refs and stage exact committed trees
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/floatx2-logs"
          root="$RUNNER_TEMP/floatx2-src"
          mkdir -p "$root/A" "$root/B"
          [[ "$A" =~ ^[0-9a-f]{40}$ && "$B" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git show -s --format=%P HEAD)" == "$B" ]]
          [[ "$(git show -s --format=%P "$B")" == "$A" ]]
          git diff --name-only --no-renames "$B" HEAD > "$RUNNER_TEMP/floatx2-logs/validation-paths.txt"
          diff -u <(printf '%s\n' .github/scripts/mac-floatx2.py .github/workflows/mac-floatx2.yml) \
            "$RUNNER_TEMP/floatx2-logs/validation-paths.txt"
          git diff --name-only --no-renames "$A" "$B" > "$RUNNER_TEMP/floatx2-logs/candidate-paths.txt"
          diff -u <(printf '%s\n' src/Tests-VM/JitOptRuntimeTest.st src/VM-Jit/OptBuilder.st vm/gen/opt_builder.c) \
            "$RUNNER_TEMP/floatx2-logs/candidate-paths.txt"
          git diff --binary "$A" "$B" > "$RUNNER_TEMP/floatx2-logs/candidate.diff"
          {
            printf 'A=%s\nB=%s\nvalidation=%s\n' "$A" "$B" "$GITHUB_SHA"
            git show -s --format='%H %T %s' "$A" "$B" HEAD
          } | tee "$RUNNER_TEMP/floatx2-logs/refs.txt"
          git archive "$A" | tar -xf - -C "$root/A"
          git archive "$B" | tar -xf - -C "$root/B"
          grep -qx 'testFloatMultiplyByTwo' "$root/B/src/Tests-VM/JitOptRuntimeTest.st"

      - name: Confirm native runner and install Homebrew dependencies
        run: |
          set -euo pipefail
          {
            [[ "$RUNNER_ARCH" == ARM64 && "$(uname -sm)" == 'Darwin arm64' ]]
            [[ "$(sysctl -in sysctl.proc_translated)" != 1 ]]
            [[ "$(brew --prefix)" == /opt/homebrew ]]
            printf 'Runner=%s Arch=%s ImageOS=%s ImageVersion=%s\n' \
              "$RUNNER_NAME" "$RUNNER_ARCH" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            sw_vers
            uname -a
            sysctl -n hw.model hw.ncpu
            xcodebuild -version
            xcrun --find clang
            xcrun clang --version
            xcrun --sdk macosx --show-sdk-version
            python3 --version
            make --version
            brew install --force-bottle sdl3 openssl@3 pkgconf
            brew list --versions sdl3 openssl@3 pkgconf
            export PKG_CONFIG_PATH="$(brew --prefix sdl3)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig"
            pkg-config --modversion sdl3 openssl
            pkg-config --cflags --libs sdl3 openssl
            printf 'PKG_CONFIG_PATH=%s\n' "$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          } 2>&1 | tee "$RUNNER_TEMP/floatx2-logs/runner.txt"

      - name: Build separate arm64 platform VMs and full images
        id: build
        run: |
          set -euo pipefail
          unset BOOT_IMAGE PACKAGES NO_PLATFORM PGO_GEN
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          clang="$(xcrun --sdk macosx --find clang)"
          test -f "$SDKROOT/usr/include/string.h"
          for side in A B; do
            (
              cd "$RUNNER_TEMP/floatx2-src/$side"
              make -j2 image "CC=$clang" NO_PGO=1
              test -f vm/build/.variant-platform
              test -s build/samaltak.image
              file vm/build/samaltak
              [[ "$(lipo -archs vm/build/samaltak)" == arm64 ]]
              otool -L vm/build/samaltak
              shasum -a 256 vm/build/samaltak build/samaltak.image \
                > "$RUNNER_TEMP/floatx2-logs/$side.sha256"
              cat "$RUNNER_TEMP/floatx2-logs/$side.sha256"
            ) 2>&1 | tee "$RUNNER_TEMP/floatx2-logs/build-$side.log"
          done

      - name: Paired AWFY CPU timings
        timeout-minutes: 15
        run: |
          python3 .github/scripts/mac-floatx2.py "$RUNNER_TEMP/floatx2-src" "$RUNNER_TEMP/floatx2-logs"

      - name: Focused Float x2 codegen and semantics test (B)
        # Collect correctness even if timing held; both must pass.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        env:
          SDL_VIDEO_DRIVER: samaltak_no_video
          SDL_VIDEODRIVER: samaltak_no_video
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/floatx2-src/B"
          expr="| r | Smalltalk vm jitArchitecture = #arm64 ifFalse: [Smalltalk quit: 1].
            r := (JitOptRuntimeTest selector: #testFloatMultiplyByTwo) run.
            Transcript show: 'JitOptRuntimeTest>>testFloatMultiplyByTwo: '; show: r summary; cr.
            Smalltalk quit: ((r passed size = 1 and: [r runCount = 1]) ifTrue: [0] ifFalse: [1])"
          vm/build/samaltak --jit opt --jit-threshold 0 --jit-flags eager \
            build/samaltak.image --headless --eval "$expr" 2>&1 | tee "$RUNNER_TEMP/floatx2-logs/focused-test.log"
          grep -F 'JitOptRuntimeTest>>testFloatMultiplyByTwo: 1 run, 1 passed, 0 failed, 0 errors' \
            "$RUNNER_TEMP/floatx2-logs/focused-test.log"

      - name: Verify the VM and image pairs stayed unchanged
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          for side in A B; do
            (cd "$RUNNER_TEMP/floatx2-src/$side" && shasum -a 256 -c "$RUNNER_TEMP/floatx2-logs/$side.sha256")
          done | tee "$RUNNER_TEMP/floatx2-logs/integrity.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-floatx2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/floatx2-logs/
          if-no-files-found: warn
          retention-days: 7
