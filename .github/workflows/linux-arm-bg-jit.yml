name: Native Linux ARM64 directional background JIT
on:
  push:
    branches: [validate/linux-arm-bg-jit-892aad8a]

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'schani/samaltak' && github.event_name == 'push' && github.ref == 'refs/heads/validate/linux-arm-bg-jit-892aad8a' && github.event.deleted == false
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm-slim
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      A: 'bfba965cab254aaf6d208139e54b3488d9cc0863'
      B: '892aad8a539b3ce264a795dc65190a0ae612f083'
      PREP: 'c3dcb0a1d42d96d0c448def5ab41b8c668c24f4d'
      LC_ALL: C
      DEBIAN_FRONTEND: noninteractive
      SDL_VIDEO_DRIVER: samaltak_no_video
      SDL_VIDEODRIVER: samaltak_no_video
    steps:
      - name: Confirm native ARM64 and install checkout prerequisites
        timeout-minutes: 4
        run: |
          set -euo pipefail
          [[ "$RUNNER_ARCH" == ARM64 && "$(uname -sm)" == 'Linux aarch64' ]]
          [[ "$(dpkg --print-architecture)" == arm64 && "$(id -u)" == 0 ]]
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4 # validation -> B -> PREP -> A
          persist-credentials: false

      - name: Verify commit chain and archive exact trees
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git show -s --format=%P HEAD)" == "$B" ]]
          [[ "$(git show -s --format=%P "$B")" == "$PREP" ]]
          [[ "$(git show -s --format=%P "$PREP")" == "$A" ]]
          logs="$RUNNER_TEMP/bg-jit-logs"
          mkdir "$logs" /tmp/bg-jit-ab /tmp/bg-jit-ab/{A,B}
          git diff --name-status --no-renames "$B" HEAD > "$logs/validation-paths.txt"
          diff -u <(printf 'A\t%s\n' .github/scripts/bg-jit-ab.py \
            .github/workflows/linux-arm-bg-jit.yml) "$logs/validation-paths.txt"
          [[ "$(git rev-parse "$A:vm/tests/bench")" == "$(git rev-parse "$B:vm/tests/bench")" ]]
          {
            uname -a
            git show -s --format='%H %T %s' "$A" "$PREP" "$B" HEAD
            printf 'awfy_tree=%s\n' "$(git rev-parse "$A:vm/tests/bench")"
            sha256sum .github/scripts/bg-jit-ab.py .github/workflows/linux-arm-bg-jit.yml
          } | tee "$logs/refs.txt"
          for side in A B; do
            git archive "${!side}" -o "/tmp/bg-jit-ab/$side.tar"
            git get-tar-commit-id < "/tmp/bg-jit-ab/$side.tar" | grep -Fx "${!side}"
            sha256sum "/tmp/bg-jit-ab/$side.tar" | tee -a "$logs/archives.sha256"
            tar -xf "/tmp/bg-jit-ab/$side.tar" -C "/tmp/bg-jit-ab/$side"
          done

      - name: Install platform VM dependencies (headless equivalent of .agents/setup)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          {
            # Full platform link and file I/O; no display server, UEFI, or Node tools.
            apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build pkg-config python3 perl binutils \
              libshaderc-dev spirv-tools libssl-dev libwayland-dev libvulkan-dev \
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev
            git clone --depth 1 --branch release-3.2.24 https://github.com/libsdl-org/SDL.git /tmp/bg-jit-ab/sdl
            git -C /tmp/bg-jit-ab/sdl rev-parse HEAD
            [[ "$(git -C /tmp/bg-jit-ab/sdl rev-parse HEAD)" == a8589a84226a6202831a3d49ff4edda4acab9acd ]]
            cmake -S /tmp/bg-jit-ab/sdl -B /tmp/bg-jit-ab/sdl/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_UNIX_CONSOLE_BUILD=ON
            cmake --build /tmp/bg-jit-ab/sdl/build --parallel 4
            cmake --install /tmp/bg-jit-ab/sdl/build
            ldconfig
            # Bookworm's shared shaderc has unresolved glslang/SPIRV-Tools symbols.
            mkdir -p /usr/local/lib/pkgconfig
            cat > /usr/local/lib/pkgconfig/shaderc.pc <<'PC'
          Name: shaderc
          Description: shaderc with its static dependencies (bookworm)
          Version: 2023.2.1
          Libs: -lshaderc_combined -Wl,--start-group -lglslang -lSPIRV -lMachineIndependent -lGenericCodeGen -lOSDependent -lOGLCompiler -lglslang-default-resource-limits -lSPIRV-Tools-opt -lSPIRV-Tools -Wl,--end-group -lstdc++ -lpthread -lm
          Cflags:
          PC
            pkg-config --modversion sdl3 openssl shaderc wayland-client
            /usr/bin/gcc --version
            make --version
            python3 --version
          } 2>&1 | tee "$RUNNER_TEMP/bg-jit-logs/toolchain.log"

      - name: Build separate native platform VMs and full images
        id: build
        timeout-minutes: 19
        run: |
          set -euo pipefail
          unset OUT BOOT_IMAGE PACKAGES NO_PLATFORM PGO_GEN MAKEFLAGS MFLAGS GNUMAKEFLAGS MAKEOVERRIDES
          unset CC CFLAGS CPPFLAGS LDFLAGS LDLIBS DISPLAY WAYLAND_DISPLAY XAUTHORITY
          for side in A B; do
            (
              cd "/tmp/bg-jit-ab/$side"
              # Environment CFLAGS lets the Makefile append required platform flags.
              CFLAGS='-O2 -g' timeout --kill-after=15s 8m make -j4 image CC=/usr/bin/gcc NO_PGO=1 BRIEF=1
              test -f vm/build/.variant-platform
              test -s build/samaltak.image
              readelf -h vm/build/samaltak | grep -E 'Machine:[[:space:]]+AArch64$'
              ldd vm/build/samaltak | tee "$RUNNER_TEMP/bg-jit-logs/$side-ldd.txt"
              grep -F libSDL3 "$RUNNER_TEMP/bg-jit-logs/$side-ldd.txt"
              sha256sum vm/build/samaltak build/samaltak.image | tee "$RUNNER_TEMP/bg-jit-logs/$side.sha256"
            ) 2>&1 | tee "$RUNNER_TEMP/bg-jit-logs/build-$side.log"
          done

      - name: Admit and pin two distinct guest-visible cores
        id: topology
        run: |
          set -euo pipefail
          python3 .github/scripts/bg-jit-ab.py topology "$RUNNER_TEMP/bg-jit-logs"

      - name: Directional AWFY paired candidate on versus off (no test controls)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python3 .github/scripts/bg-jit-ab.py compare "$RUNNER_TEMP/bg-jit-logs"

      - name: Verify the VM and image pairs stayed unchanged
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          for side in A B; do
            (cd "/tmp/bg-jit-ab/$side" && sha256sum -c "$RUNNER_TEMP/bg-jit-logs/$side.sha256")
          done | tee "$RUNNER_TEMP/bg-jit-logs/integrity.log"

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-arm-bg-jit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bg-jit-logs/
          if-no-files-found: warn
          retention-days: 7
